# 共享实现见 FindDataTechnology/fd-ci（openspec: extract-shared-ci-workflow）。
#
# 本仓与其他仓不同：出镜像前必须先跑一遍测试（凭据与协议契约是核心不变量，
# 测试不过不应出片）。测试留在本仓，是它自己的 job；两个 build job 用 needs 串在
# 它后面 —— 共享 workflow 因此不需要为「构建前要跑测试」开一个输入。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # 2026-11-20 修正：原指向 scs001/fd-open-data-protocol-images，该仓已不存在
          # （GitHub 404），导致 api-test job 的 checkout 直接失败、整条出片链断。
          # 改用同协议包的公开源仓（pip install -e 需要的就是它）。
          repository: FindDataTechnology/fd-open-data-protocol
          path: fd-open-data-protocol

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ../fd-open-data-protocol

          pip install -e ".[dev]"

      - name: Test suite
        working-directory: server
        run: python -m pytest tests/ -q

  web:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-shilun-web
      namespace: finddata-business
      context: web
      dockerfile: web/Dockerfile

  api:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-shilun-api
      namespace: finddata-business
      context: server
      dockerfile: server/Dockerfile
